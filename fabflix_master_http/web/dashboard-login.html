<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fabflix</title>
    <script src='https://www.google.com/recaptcha/api.js'></script>
</head>
<body>
<h2>Login to Fabflix Admin</h2>
<!-- Set the method to POST to avoid showing the username/password in the URL
     The default action is disabled to allow your own implementation. -->
<form id="dashboard_login_form" method="post" action="#">
    <label><b>Email</b></label>
    <label>
        <input name="email" placeholder="Enter Email" type="text">
    </label>
    <br>
    <label><b>Password</b></label>
    <label>
        <input name="password" placeholder="Enter Password" type="password">
    </label>
    <br>
    <div class="g-recaptcha" data-sitekey="6LeEnsIaAAAAACkYJEHiGNJ0NybQjdzkBlPGfDYf"></div>
    <br>
    <input type="submit" value="Login">
</form>

<div id="dashboard_login_error_message"></div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- include our own JS file -->
<script src="dashboard-login.js"></script>
</body>
</html>
